<header class="admin-topbar">
  <div class="brand-zone">
    <a routerLink="/admin" class="brand-logo">
      <span class="logo-red">VICMART</span>
      <span class="logo-role">Admin</span>
    </a>
  </div>

  <div class="actions-zone">
    <a routerLink="/" class="btn-pill btn-secondary" title="Quay lại trang mua sắm">
      Xem website
    </a>
  </div>

  <div class="profile-zone">
    <button
      type="button"
      class="profile-trigger"
      aria-haspopup="menu"
      [attr.aria-expanded]="isOpen()"
      aria-label="Mở menu quản trị viên"
      (click)="toggleMenu()"
    >
      @if (profileService.avatarUrl(); as avatarUrl) {
        <img [src]="avatarUrl" [alt]="adminName()" class="avatar-circle avatar-img" />
      } @else {
        <div class="avatar-circle">{{ avatarInitial() }}</div>
      }
      <span class="admin-name">{{ adminName() }}</span>
    </button>

    @if (isOpen()) {
      <div class="admin-dropdown" role="menu" aria-label="Menu quản trị viên">
        <a
          routerLink="/admin/profile"
          role="menuitem"
          class="admin-dropdown__item"
          (click)="closeMenu()"
        >
          Hồ sơ của tôi
        </a>
        <hr class="admin-dropdown__divider" />
        <button
          type="button"
          role="menuitem"
          class="admin-dropdown__item admin-dropdown__item--danger"
          (click)="logout()"
        >
          Đăng xuất
        </button>
      </div>
    }
  </div>
</header>
