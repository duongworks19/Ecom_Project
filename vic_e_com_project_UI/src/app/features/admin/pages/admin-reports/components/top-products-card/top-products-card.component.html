<div class="top-card">
  <h3 class="card-title">Top 5 sản phẩm bán chạy (số lượng)</h3>

  <div class="product-list">
    @for (item of products; track item.rank) {
      <div class="product-item">
        <div class="product-meta">
          <span class="product-name">{{ item.rank }}. {{ item.name }}</span>
          <span class="product-count">{{ item.soldCount }}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" [style.width.%]="item.percentage"></div>
        </div>
      </div>
    }
  </div>
</div>
