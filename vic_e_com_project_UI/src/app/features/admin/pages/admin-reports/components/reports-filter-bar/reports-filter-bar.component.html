<div class="filter-bar">
  <!-- Period Pills -->
  <div class="period-pills">
    @for (period of periods; track period.id) {
      <button
        type="button"
        class="pill-btn"
        [class.active]="selectedPeriod() === period.id"
        (click)="selectPeriod(period.id)"
      >
        {{ period.label }}
      </button>
    }
  </div>

  <!-- Select Dropdowns -->
  <div class="filter-dropdowns">
    <div class="dropdown-wrapper">
      <select class="filter-select" (change)="selectVendor($any($event.target).value)">
        <option value="all">Vendor: Tất cả</option>
        @for (vendor of vendors; track vendor.id) { <option [value]="vendor.id">{{ vendor.name }}</option> }
      </select>
    </div>

    <div class="dropdown-wrapper">
      <select class="filter-select" (change)="selectCategory($any($event.target).value)">
        <option value="all">Danh mục: Tất cả</option>
        @for (category of categories; track category.id) { <option [value]="category.id">{{ category.name }}</option> }
      </select>
    </div>
  </div>
</div>
