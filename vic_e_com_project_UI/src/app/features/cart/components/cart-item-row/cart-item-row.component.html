<div class="cart-item" [class.cart-item--updating]="isUpdating" role="row">
  <!-- Checkbox + Info sản phẩm -->
  <div class="cart-item__product">
    <input
      type="checkbox"
      class="cart-item__checkbox"
      [checked]="isChecked"
      [disabled]="isUpdating"
      (change)="onCheckboxChange($event)"
      aria-label="Chọn sản phẩm {{ item.productName }}"
    />

    <div class="cart-item__thumb">
      @if (item.imageUrl) {
        <img [src]="item.imageUrl" [alt]="item.productName" loading="lazy" />
      } @else {
        <div class="cart-item__no-image">📦</div>
      }
    </div>

    <div class="cart-item__info">
      <h3 class="cart-item__name" [title]="item.productName">
        {{ item.productName }}
      </h3>

      <!-- Nút chọn phân loại -->
      <button
        type="button"
        class="cart-item__variant-btn"
        [disabled]="isUpdating"
        (click)="onRequestVariantChange()"
        title="Nhấn để đổi phân loại hàng"
      >
        <span class="cart-item__variant-label">Phân loại: {{ item.variantLabel || 'Mặc định' }}</span>
        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      @if (item.lowStock) {
        <span class="cart-item__low-stock">Chỉ còn {{ item.stockQty }} sản phẩm</span>
      }
    </div>
  </div>

  <!-- Đơn giá -->
  <div class="cart-item__price">
    <span class="cart-item__price-val">{{ item.unitPrice | vndCurrency }}</span>
  </div>

  <!-- Bộ chọn số lượng -->
  <div class="cart-item__qty">
    <div class="cart-item__stepper">
      <button
        type="button"
        class="cart-item__step-btn"
        [disabled]="item.quantity <= 1 || isUpdating"
        (click)="onDecrease()"
        aria-label="Giảm số lượng"
      >
        −
      </button>
      <input
        type="number"
        class="cart-item__step-input"
        [value]="item.quantity"
        [disabled]="isUpdating"
        (change)="onQuantityInputChange($event)"
        min="1"
        [max]="item.stockQty"
        aria-label="Số lượng"
      />
      <button
        type="button"
        class="cart-item__step-btn"
        [disabled]="item.quantity >= item.stockQty || isUpdating"
        (click)="onIncrease()"
        aria-label="Tăng số lượng"
      >
        +
      </button>
    </div>
  </div>

  <!-- Thành tiền -->
  <div class="cart-item__total">
    <span class="cart-item__total-val">{{ item.lineTotal | vndCurrency }}</span>
  </div>

  <!-- Nút Xóa -->
  <div class="cart-item__action">
    <button
      type="button"
      class="cart-item__delete-btn"
      [disabled]="isUpdating"
      (click)="onDelete()"
      aria-label="Xóa sản phẩm"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        <line x1="10" y1="11" x2="10" y2="17" />
        <line x1="14" y1="11" x2="14" y2="17" />
      </svg>
      <span class="cart-item__delete-text">Xóa</span>
    </button>
  </div>
</div>
