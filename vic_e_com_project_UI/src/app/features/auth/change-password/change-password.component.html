<main class="change-pw-screen">
  <div class="change-pw-card">
    <div class="brand-badge">VICMART</div>
    <h1 class="card-title">Đổi mật khẩu để tiếp tục</h1>
    <p class="card-desc">
      Đây là lần đăng nhập đầu tiên. Vì lý do bảo mật, bạn cần đặt mật khẩu mới trước khi dùng hệ
      thống.
    </p>

    @if (successMessage(); as msg) {
      <div class="success-banner" role="status">{{ msg }}</div>
    }

    <app-password-form (changed)="onSubmitSuccess()" />

    <button type="button" class="btn-secondary" (click)="onLogout()">Đăng xuất</button>
  </div>
</main>
