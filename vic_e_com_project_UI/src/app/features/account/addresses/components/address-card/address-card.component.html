<article class="address-card">
  <div class="address-card__info">
    <div class="address-card__header">
      <span class="address-card__name">{{ address().recipientName }}</span>
      <span class="address-card__sep" aria-hidden="true">|</span>
      <span class="address-card__phone">{{ formattedPhone() }}</span>
      @if (address().isDefault) {
        <app-tag variant="dark">Mặc định</app-tag>
      }
    </div>

    <p class="address-card__line">{{ address().streetAddress }}</p>
    <p class="address-card__line">{{ regionLine() }}</p>
  </div>

  <div class="address-card__actions">
    <div class="address-card__links">
      <button
        type="button"
        class="address-card__link"
        (click)="editClicked.emit(address())"
      >
        Cập nhật
      </button>

      @if (!address().isDefault) {
        <button
          type="button"
          class="address-card__link address-card__link--danger"
          (click)="deleteClicked.emit(address())"
        >
          Xóa
        </button>
      }
    </div>

    @if (!address().isDefault) {
      <app-button
        variant="secondary"
        [loading]="settingDefault()"
        (clicked)="setDefaultClicked.emit(address())"
      >
        Thiết lập mặc định
      </app-button>
    }
  </div>
</article>
