<app-dialog
  [open]="open()"
  [title]="'Đổi mật khẩu tài khoản'"
  [maxWidth]="'480px'"
  (closed)="onCancel()"
>
  <div class="change-pw-dialog-body">
    <p class="dialog-subtitle">
      Nhập mật khẩu hiện tại và mật khẩu mới để bảo vệ tài khoản shipper của bạn.
    </p>

    <app-password-form (changed)="onPasswordChanged()" />
  </div>
</app-dialog>
