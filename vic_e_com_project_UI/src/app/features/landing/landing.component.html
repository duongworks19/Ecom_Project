<div class="landing-page-wrapper">
  <!-- 1. Sticky Primary Header -->
  <app-header-nav
    [categories]="categories()"
    [activeCategoryId]="activeCategoryId()"
    (categorySelected)="onCategorySelected($event)"
    (searchQueryChanged)="onSearchQueryChanged($event)"
  />

  <!-- 2. Trust Badges Strip (40px flat) -->
  <app-hero-banner />

  <!-- 2b. Multi-criteria Product Filter Bar (UC05 & UC06) -->
  <app-product-filter-bar [categories]="categories()" />

  <!-- 3. Flash Sale Countdown Section -->
  <app-flash-sale />

  <!-- 4. Pinterest Masonry Product Feed -->
  <app-product-masonry
    [products]="filteredProducts()"
    [activeCategory]="currentCategory()"
    [isLoading]="isLoading()"
    (resetCategory)="onResetCategory()"
    (saveToggled)="onSaveToggled($event)"
  />

  <!-- 5. Footer (giữ nguyên 100%) -->
  <app-footer />

  <!-- Toast Feedback -->
  @if (toastMessage(); as msg) {
    <div class="toast-floating" role="status">
      <span>{{ msg }}</span>
    </div>
  }
</div>
