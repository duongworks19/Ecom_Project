<section class="product-filter-bar-container" aria-label="Thanh lọc sản phẩm">
  <div class="filter-bar-card">
    <div class="filter-controls-group">
      <!-- 1. Danh mục đa tầng (Accordion Tree Select) -->
      <div class="filter-field">
        <app-category-tree-select
          [categories]="categories"
          [selectedSlug]="selectedCategory()"
          (selectionChange)="onCategorySelected($event)"
        />
      </div>

      <!-- 2. Khoảng giá (Custom Select chuẩn CSS bo góc 16px giống ảnh 1) -->
      <div class="filter-field">
        <app-custom-select
          [options]="priceOptions"
          [selectedValue]="selectedPriceRange()"
          placeholder="Tất cả mức giá"
          (selectionChange)="onPriceChange($event)"
        />
      </div>

      <!-- 3. Đánh giá (Custom Select chuẩn CSS bo góc 16px giống ảnh 1) -->
      <div class="filter-field">
        <app-custom-select
          [options]="ratingOptions"
          [selectedValue]="selectedRating()"
          placeholder="Tất cả đánh giá"
          (selectionChange)="onRatingChange($event)"
        />
      </div>

      <!-- 4. Sắp xếp (Custom Select chuẩn CSS bo góc 16px giống ảnh 1) -->
      <div class="filter-field">
        <app-custom-select
          [options]="sortOptions"
          [selectedValue]="selectedSort()"
          placeholder="Sắp xếp: Mặc định"
          (selectionChange)="onSortChange($event)"
        />
      </div>
    </div>

    <!-- Cụm nút hành động -->
    <div class="filter-actions-group">
      <button
        type="button"
        class="btn-clear"
        (click)="onClearFilter()"
        id="btn-clear-filters"
      >
        Xóa lọc
      </button>
      <button
        type="button"
        class="btn-submit"
        (click)="onApplyFilter()"
        id="btn-apply-filters"
      >
        Lọc sản phẩm
      </button>
    </div>
  </div>
</section>
