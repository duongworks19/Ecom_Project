<!-- Trust Badges Strip (40px flat) -->
<div class="trust-strip" role="list" aria-label="Cam kết chất lượng">
  @for (badge of badges; track badge.icon) {
    <div class="trust-item" role="listitem">
      <span class="trust-icon">{{ badge.icon }}</span>
      <span class="trust-label">{{ badge.label }}</span>
    </div>
  }
</div>
