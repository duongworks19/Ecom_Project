<div class="cart-panel">
  @if (isLoading()) {
    <div class="cart-panel__loading">
      <div class="cart-panel__spinner"></div>
      <span>Đang tải thông tin phân loại...</span>
    </div>
  } @else if (errorMsg()) {
    <div class="cart-panel__error">
      <span>{{ errorMsg() }}</span>
      <button type="button" class="cart-panel__retry-btn" (click)="loadVariants()">Thử lại</button>
    </div>
  } @else {
    <!-- Price Row -->
    @if (getSelectedVariant(); as v) {
      <div class="cart-panel__price-row">
        <span class="cart-panel__price">{{ v.price | vndCurrency }}</span>
        <span class="cart-panel__stock">Kho: <b>{{ v.stockQty }}</b> sản phẩm</span>
      </div>
    }

    <!-- Variants Selection -->
    @if (variants().length > 0) {
      <div class="cart-panel__section">
        <label class="cart-panel__label">Phân loại hàng:</label>
        <div class="cart-panel__options">
          @for (v of variants(); track v.variantId) {
            <button
              type="button"
              class="cart-panel__option-btn"
              [class.active]="selectedVariantId() === v.variantId"
              [disabled]="!v.available || v.stockQty <= 0"
              (click)="selectVariant(v)"
            >
              {{ v.label }}
              @if (!v.available || v.stockQty <= 0) {
                <span class="cart-panel__oos">(Hết hàng)</span>
              }
            </button>
          }
        </div>
      </div>
    }

    <!-- Quantity Stepper -->
    <div class="cart-panel__section cart-panel__section--qty">
      <label class="cart-panel__label">Số lượng:</label>
      <div class="cart-panel__stepper">
        <button
          type="button"
          class="cart-panel__step-btn"
          [disabled]="quantity() <= 1 || isSubmitting()"
          (click)="decreaseQty()"
          aria-label="Giảm"
        >
          −
        </button>
        <input
          type="number"
          class="cart-panel__step-input"
          [value]="quantity()"
          [disabled]="isSubmitting() || !selectedVariantId()"
          (change)="onQuantityChange($event)"
          min="1"
          [max]="getSelectedVariant()?.stockQty || 999"
        />
        <button
          type="button"
          class="cart-panel__step-btn"
          [disabled]="!getSelectedVariant() || quantity() >= (getSelectedVariant()?.stockQty || 1) || isSubmitting()"
          (click)="increaseQty()"
          aria-label="Tăng"
        >
          +
        </button>
      </div>
    </div>

    <!-- Actions -->
    <div class="cart-panel__actions">
      <button
        type="button"
        class="cart-panel__add-btn"
        [disabled]="isSubmitting() || !selectedVariantId() || (getSelectedVariant() && getSelectedVariant()!.stockQty <= 0)"
        (click)="onAddToCart()"
        id="btn-add-to-cart"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        <span>{{ isSubmitting() ? 'Đang thêm...' : 'Thêm vào giỏ hàng' }}</span>
      </button>
    </div>
  }
</div>
