<div class="scrim" [class.on]="isOpen" role="dialog" aria-modal="true">
  <div class="modal">
    <h2>{{ product ? ('Sửa sản phẩm: ' + product.n) : 'Thêm sản phẩm mới' }}</h2>

    <label style="display: block; margin-top: 12px; font-size: 13px; font-weight: 600;">
      Tên sản phẩm *
      <input
        class="inp"
        type="text"
        [ngModel]="formProductName()"
        (ngModelChange)="formProductName.set($event)"
        placeholder="VD: Đèn ngủ gỗ sồi Bắc Âu"
        maxlength="150"
      />
    </label>

    <div class="g2">
      <label style="display: block; margin-top: 12px; font-size: 13px; font-weight: 600;">
        Danh mục *
        <select class="inp" [ngModel]="formCategoryId()" (ngModelChange)="onCategoryChange($event)">
          @if (!formCategoryId()) {
            <option [ngValue]="null" disabled selected>-- Chọn danh mục --</option>
          }
          @for (cat of categories; track cat.id) {
            <option [ngValue]="cat.id">{{ cat.displayName }}</option>
          }
          @if (categories.length === 0) {
            <option [ngValue]="null">{{ formCategory() || 'Đang tải danh mục...' }}</option>
          }
        </select>
      </label>

      <label style="display: block; margin-top: 12px; font-size: 13px; font-weight: 600;">
        Trạng thái
        <select class="inp" [ngModel]="formStatus()" (ngModelChange)="formStatus.set($event)">
          <option value="VISIBLE">Đang bán</option>
          <option value="HIDDEN">Đã ẩn</option>
          <option value="DRAFT">Nháp</option>
        </select>
      </label>
    </div>

    <label style="display: block; margin-top: 12px; font-size: 13px; font-weight: 600;">
      Mô tả sản phẩm
      <textarea
        [ngModel]="formDescription()"
        (ngModelChange)="formDescription.set($event)"
        placeholder="Mô tả chất liệu, kích thước, công dụng..."
      ></textarea>
    </label>

    <!-- Subcomponent: Media uploader & thumbnails -->
    <app-seller-product-media
      [mediaList]="formMedia()"
      [imageUrl]="formImageUrl()"
      [selectedIndex]="selectedMediaIndex()"
      (mediaListChange)="formMedia.set($event)"
      (imageUrlChange)="formImageUrl.set($event)"
      (selectedIndexChange)="selectedMediaIndex.set($event)"
      (previewRequest)="openPreview($event)"
      (uploadError)="modalError.set($event)"
    ></app-seller-product-media>

    <!-- Biến thể sản phẩm -->
    <h3 style="margin: 16px 0 6px; font-size: 15px;">Biến thể: SKU · Phân loại · Giá · Tồn kho · Ngưỡng cảnh báo</h3>
    @for (v of formVariants(); track $index) {
      <div class="vr">
        <input class="inp" placeholder="SKU" [(ngModel)]="v.sku" />
        <input class="inp" placeholder="Phân loại" [(ngModel)]="v.a" />
        <input class="inp" type="number" min="0" placeholder="Giá (đ)" [(ngModel)]="v.p" />
        <input class="inp" type="number" min="0" placeholder="Tồn kho" [(ngModel)]="v.q" />
        <input class="inp" type="number" min="0" placeholder="Ngưỡng" [(ngModel)]="v.l" />
        <button class="btn sm" (click)="removeVariantRow($index)" [disabled]="formVariants().length <= 1">×</button>
      </div>
    }

    <button class="btn sm" style="margin-top: 8px;" (click)="addVariantRow()">+ Thêm biến thể</button>

    @if (modalError()) {
      <div class="err" style="margin-top: 10px;" role="alert">{{ modalError() }}</div>
    }

    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px;">
      <button class="btn" type="button" (click)="close.emit()">Đóng</button>
      <button class="btn p" type="button" (click)="submit()">Lưu sản phẩm</button>
    </div>
  </div>
</div>

<!-- Lightbox previewing product media -->
<app-seller-media-lightbox
  [isOpen]="isMediaPreviewOpen()"
  [mediaList]="formMedia()"
  [selectedIndex]="selectedMediaIndex()"
  (close)="isMediaPreviewOpen.set(false)"
  (indexChange)="selectedMediaIndex.set($event)"
></app-seller-media-lightbox>
