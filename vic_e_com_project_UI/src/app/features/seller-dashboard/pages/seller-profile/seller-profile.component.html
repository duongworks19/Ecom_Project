<div class="hd">
  <div>
    <h1 style="font-size: 28px">Hồ sơ gian hàng ({{ shopName() }})</h1>
    <p class="sub">Tài khoản chủ sở hữu: <b>{{ userAccountName() }}</b> · Thông tin hiển thị công khai trên sàn thương mại điện tử.</p>
  </div>
</div>

<div class="box" style="max-width: 720px;">
  <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line);">
    <div class="profile-logo-wrap" style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: var(--bg); display: grid; place-items: center; border: 2px solid var(--line); flex-shrink: 0;">
      @if (shopLogo() && !logoLoadFailed()) {
        <img [src]="shopLogo()" [alt]="shopName()" style="width: 100%; height: 100%; object-fit: cover; display: block;" (error)="onLogoError()" />
      } @else {
        <span style="font-size: 32px; font-weight: 800; color: var(--red);">{{ shopName().charAt(0).toUpperCase() }}</span>
      }
    </div>
    <div>
      <h3 style="margin: 0 0 6px; font-size: 16px;">Logo gian hàng</h3>
      <label class="btn sm" style="cursor: pointer;">
        Thay đổi logo
        <input type="file" hidden accept="image/*" (change)="onLogoFileSelect($event)" />
      </label>
    </div>
  </div>

  <div class="g2">
    <label style="display: block; margin-top: 12px; font-size: 13px; font-weight: 600;">
      Tên gian hàng *
      <input class="inp" type="text" [(ngModel)]="formShopProfile.n" />
    </label>

    <label style="display: block; margin-top: 12px; font-size: 13px; font-weight: 600;">
      Số điện thoại liên hệ *
      <input class="inp" type="tel" [(ngModel)]="formShopProfile.ph" />
    </label>

    <label style="display: block; margin-top: 12px; font-size: 13px; font-weight: 600;">
      Email
      <input class="inp" type="email" [(ngModel)]="formShopProfile.em" />
    </label>

    <label style="display: block; margin-top: 12px; font-size: 13px; font-weight: 600;">
      Giờ hoạt động
      <input class="inp" type="text" [(ngModel)]="formShopProfile.hr" />
    </label>
  </div>

  <label style="display: block; margin-top: 12px; font-size: 13px; font-weight: 600;">
    Mô tả gian hàng
    <textarea rows="3" [(ngModel)]="formShopProfile.d"></textarea>
  </label>

  <label style="display: block; margin-top: 12px; font-size: 13px; font-weight: 600;">
    Địa chỉ kho lấy hàng
    <input class="inp" type="text" [(ngModel)]="formShopProfile.ad" />
  </label>

  <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px;">
    @if (currentShopId()) {
      <a [routerLink]="['/shop', currentShopId()]" target="_blank" class="btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
        👁️ Xem gian hàng
      </a>
    }
    <button class="btn p" type="button" (click)="saveShopProfile()">Lưu thay đổi</button>
  </div>
</div>
