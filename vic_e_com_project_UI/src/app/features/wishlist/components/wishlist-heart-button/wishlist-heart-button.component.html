<button
  type="button"
  class="heart-btn"
  [class.heart-btn--liked]="isLiked()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-pressed]="isLiked()"
  (click)="onToggle($event)"
>
  @if (isLiked()) {
    <!-- Tim đỏ đặc khi đã yêu thích -->
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
  } @else {
    <!-- Tim viền khi chưa yêu thích -->
    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
  }
</button>
