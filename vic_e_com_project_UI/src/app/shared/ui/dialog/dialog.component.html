@if (open()) {
  <div
    class="dialog-scrim"
    (click)="onBackdropClick($event)"
    (keydown)="onKeyDown($event)"
  >
    <div
      #dialogPanel
      class="dialog-card"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="dialogId() + '-title'"
      [style.max-width]="maxWidth()"
      tabindex="-1"
    >
      <div class="dialog-card__header">
        <h2 class="dialog-card__title" [id]="dialogId() + '-title'">{{ title() }}</h2>
        <button
          type="button"
          class="dialog-card__close"
          aria-label="Đóng hộp thoại"
          (click)="close()"
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="dialog-card__body">
        <ng-content />
      </div>
    </div>
  </div>
}
