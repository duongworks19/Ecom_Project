<div class="user-menu">
  <button
    #triggerButton
    type="button"
    class="user-menu__trigger"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen()"
    aria-label="Mở menu tài khoản"
    (click)="toggleMenu()"
    (keydown)="onTriggerKeyDown($event)"
  >
    <app-avatar
      [src]="profileService.avatarUrl()"
      [name]="profileService.displayName()"
      [size]="40"
    />
  </button>

  @if (isOpen()) {
    <div
      class="user-menu__dropdown"
      role="menu"
      aria-label="Menu tài khoản"
      (keydown)="onMenuKeyDown($event)"
    >
      <button
        #menuItem
        type="button"
        role="menuitem"
        class="user-menu__item"
        (click)="navigateToProfile()"
      >
        Tài khoản của tôi
      </button>

      <button
        #menuItem
        type="button"
        role="menuitem"
        class="user-menu__item"
        (click)="navigateToOrders()"
      >
        Đơn mua
      </button>

      <div class="user-menu__divider" role="separator"></div>

      <button
        #menuItem
        type="button"
        role="menuitem"
        class="user-menu__item user-menu__item--danger"
        (click)="logout()"
      >
        Đăng xuất
      </button>
    </div>
  }
</div>
