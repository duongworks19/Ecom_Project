<div
  class="vic-avatar"
  [style.width.px]="size()"
  [style.height.px]="size()"
  [style.font-size.px]="resolvedFontSize()"
  [attr.aria-label]="name() || 'Ảnh đại diện'"
>
  @if (src() && !imageFailed()) {
    <img
      class="vic-avatar__img"
      [src]="src()!"
      [alt]="name() || 'Ảnh đại diện'"
      (error)="onImageError()"
    />
  } @else {
    <span class="vic-avatar__initial" aria-hidden="true">{{ initial() }}</span>
  }
</div>
