<div class="form-field" [class.form-field--error]="!!error()">
  <label class="form-field__label" [attr.for]="controlId()">
    <span>{{ label() }}</span>
    @if (required()) {
      <span class="form-field__required" aria-hidden="true">*</span>
    }
  </label>

  <div class="form-field__control">
    <ng-content />
  </div>

  @if (hint() && !error()) {
    <p class="form-field__hint" [id]="controlId() + '-hint'">{{ hint() }}</p>
  }

  @if (error()) {
    <p class="form-field__error" [id]="controlId() + '-error'" role="alert">
      {{ error() }}
    </p>
  }
</div>
