<div class="customer-shell">
  <header class="customer-header">
    <div class="customer-header__inner">
      <a routerLink="/" class="customer-header__brand" aria-label="Trang chủ VIC MART">
        <span class="customer-header__logo-badge" aria-hidden="true">V</span>
        <span class="customer-header__brand-name">VIC MART</span>
      </a>

      <div class="customer-header__search" role="search">
        <label class="sr-only" for="customer-global-search">Tìm kiếm sản phẩm</label>
        <svg
          class="customer-header__search-icon"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          id="customer-global-search"
          type="search"
          class="customer-header__search-input"
          placeholder="Tìm kiếm sản phẩm, thương hiệu, cửa hàng..."
          autocomplete="off"
        />
      </div>

      <div class="customer-header__actions">
        <button
          type="button"
          class="customer-header__cart-btn"
          aria-label="Giỏ hàng"
        >
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            aria-hidden="true"
          >
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </button>

        <app-user-menu />
      </div>
    </div>
  </header>

  <main class="customer-shell__main">
    <router-outlet />
  </main>

  <app-toast />
</div>
