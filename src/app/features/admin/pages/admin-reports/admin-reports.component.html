@if (reportsData(); as data) {
  <div class="reports-page">
    <!-- Page Header -->
    <section class="page-header">
      <div class="header-left">
        <h1 class="page-title">Báo cáo & xuất dữ liệu</h1>
        <p class="page-subtitle">
          Theo dõi doanh thu, đơn hàng, vendor và tải dữ liệu về để đối soát.
        </p>
      </div>
      <button type="button" class="btn-export-main">
        Xuất báo cáo
      </button>
    </section>

    <!-- Filters Strip -->
    <section class="section-filters">
      <vic-reports-filter-bar (periodChange)="onPeriodChanged($event)"></vic-reports-filter-bar>
    </section>

    <!-- KPI Summary Cards -->
    <section class="section-kpis">
      <vic-reports-kpi [kpis]="data.kpis"></vic-reports-kpi>
    </section>

    <!-- Revenue Line Chart -->
    <section class="section-chart">
      <vic-revenue-line-chart [trendPoints]="data.revenueTrend"></vic-revenue-line-chart>
    </section>

    <!-- 2-Col: Top Products & Top Vendors -->
    <section class="section-top-grid">
      <div class="col-item">
        <vic-top-products-card [products]="data.topProducts"></vic-top-products-card>
      </div>
      <div class="col-item">
        <vic-top-vendors-card [vendors]="data.topVendors"></vic-top-vendors-card>
      </div>
    </section>

    <!-- Export Data Section -->
    <section class="section-export">
      <vic-export-data-card [items]="data.exportItems"></vic-export-data-card>
    </section>
  </div>
}
