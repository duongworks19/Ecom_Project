<div class="table-card">
  <div class="table-header">
    <span class="col-customer">CUSTOMER</span>
    <span class="col-status">TRẠNG THÁI</span>
    <span class="col-date">NGÀY ĐĂNG KÝ</span>
  </div>

  <div class="table-body">
    @for (customer of customers; track customer.id) {
      <button
        type="button"
        class="table-row"
        [class.selected]="customer.id === selectedCustomerId"
        (click)="selectCustomer.emit(customer)"
      >
        <div class="col-customer customer-cell">
          <div class="avatar-circle">{{ customer.initial }}</div>
          <div class="customer-info">
            <span class="customer-name">{{ customer.fullName }}</span>
            <span class="customer-email">{{ customer.email }}</span>
          </div>
        </div>

        <div class="col-status">
          <span
            class="status-badge"
            [class.active]="customer.status === 'ACTIVE'"
            [class.locked]="customer.status === 'LOCKED'"
          >
            <span class="dot"></span>
            {{ customer.status === 'ACTIVE' ? 'Hoạt động' : 'Đã khóa' }}
          </span>
        </div>

        <div class="col-date date-text">
          {{ customer.createdAt }}
        </div>
      </button>
    } @empty {
      <div class="empty-state">Không tìm thấy Customer phù hợp.</div>
    }
  </div>

  <div class="table-footer">
    <span class="footer-info">
      Hiển thị {{ startItem }} đến {{ endItem }} trên {{ totalCount }} Customer
    </span>
    <div class="pagination-btns">
      <button
        type="button"
        class="btn-page btn-prev"
        [disabled]="page <= 0"
        (click)="onPrevPage()"
      >
        Trước
      </button>
      <button
        type="button"
        class="btn-page btn-next"
        [disabled]="page + 1 >= totalPages"
        (click)="onNextPage()"
      >
        Sau
      </button>
    </div>
  </div>
</div>
