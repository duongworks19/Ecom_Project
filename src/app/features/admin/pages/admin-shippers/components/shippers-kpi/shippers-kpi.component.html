<div class="kpi-grid">
  <div class="kpi-card dark-theme">
    <span class="kpi-title">Tổng shipper</span>
    <div class="kpi-value">{{ summary.total }}</div>
    <span class="kpi-subtext highlight">Tài khoản do Admin tạo</span>
  </div>

  <div class="kpi-card">
    <span class="kpi-title">Sẵn sàng nhận đơn</span>
    <div class="kpi-value">{{ summary.available }}</div>
    <span class="kpi-subtext">Có thể phân công ngay</span>
  </div>

  <div class="kpi-card">
    <span class="kpi-title">Đang giao</span>
    <div class="kpi-value">{{ summary.busy }}</div>
    <span class="kpi-subtext">{{ summary.deliveringOrders }} đơn đang trên đường</span>
  </div>

  <div class="kpi-card">
    <span class="kpi-title">Đã khóa</span>
    <div class="kpi-value">{{ summary.locked }}</div>
    <span class="kpi-subtext">Tạm dừng quyền giao hàng</span>
  </div>
</div>
