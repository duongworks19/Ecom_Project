<div class="filter-bar">
  <div class="search-box">
    <svg
      class="search-icon"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </svg>
    <input
      type="search"
      class="search-input"
      [formControl]="keywordControl"
      placeholder="Tìm theo ID, tên hoặc số điện thoại"
      aria-label="Tìm theo ID, tên hoặc số điện thoại"
    />
  </div>

  <div class="select-wrapper">
    <select
      class="status-select"
      [formControl]="statusControl"
      aria-label="Lọc theo trạng thái shipper"
    >
      <option value="ALL">Trạng thái: Tất cả</option>
      <option value="AVAILABLE">Trạng thái: Sẵn sàng</option>
      <option value="BUSY">Trạng thái: Đang giao</option>
      <option value="OFFLINE">Trạng thái: Nghỉ</option>
      <option value="LOCKED">Trạng thái: Đã khóa</option>
    </select>
  </div>
</div>
