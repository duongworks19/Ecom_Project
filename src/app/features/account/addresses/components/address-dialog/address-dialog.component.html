<app-dialog
  [open]="open()"
  [title]="dialogTitle()"
  dialogId="address-upsert-dialog"
  maxWidth="540px"
  (closed)="onClose()"
>
  <form
    class="address-dialog-form"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    novalidate
  >
    <div class="address-dialog-form__row-2">
      <app-form-field
        label="Họ và tên người nhận"
        controlId="addr-recipient-name"
        [required]="true"
        [error]="getError('recipientName')"
      >
        <input
          id="addr-recipient-name"
          aria-label="Họ và tên người nhận"
          type="text"
          class="vic-dialog-input"
          formControlName="recipientName"
          placeholder="Nhập họ và tên"
          [attr.aria-invalid]="!!getError('recipientName')"
          [attr.aria-describedby]="getError('recipientName') ? 'addr-recipient-name-error' : null"
        />
      </app-form-field>

      <app-form-field
        label="Số điện thoại"
        controlId="addr-phone"
        [required]="true"
        [error]="getError('phone')"
      >
        <input
          id="addr-phone"
          aria-label="Số điện thoại"
          type="tel"
          class="vic-dialog-input"
          formControlName="phone"
          placeholder="090 123 4218"
          [attr.aria-invalid]="!!getError('phone')"
          [attr.aria-describedby]="getError('phone') ? 'addr-phone-error' : null"
        />
      </app-form-field>
    </div>

    <div class="address-dialog-form__row-3">
      <app-form-field
        label="Tỉnh / Thành phố"
        controlId="addr-province"
        [required]="true"
        [error]="getError('province')"
      >
        <input
          id="addr-province"
          aria-label="Tỉnh / Thành phố"
          type="text"
          class="vic-dialog-input"
          formControlName="province"
          placeholder="TP. Hồ Chí Minh"
          [attr.aria-invalid]="!!getError('province')"
          [attr.aria-describedby]="getError('province') ? 'addr-province-error' : null"
        />
      </app-form-field>

      <app-form-field
        label="Quận / Huyện"
        controlId="addr-district"
        [required]="true"
        [error]="getError('district')"
      >
        <input
          id="addr-district"
          aria-label="Quận / Huyện"
          type="text"
          class="vic-dialog-input"
          formControlName="district"
          placeholder="Quận 1"
          [attr.aria-invalid]="!!getError('district')"
          [attr.aria-describedby]="getError('district') ? 'addr-district-error' : null"
        />
      </app-form-field>

      <app-form-field
        label="Phường / Xã"
        controlId="addr-ward"
        [required]="true"
        [error]="getError('ward')"
      >
        <input
          id="addr-ward"
          aria-label="Phường / Xã"
          type="text"
          class="vic-dialog-input"
          formControlName="ward"
          placeholder="Phường Bến Nghé"
          [attr.aria-invalid]="!!getError('ward')"
          [attr.aria-describedby]="getError('ward') ? 'addr-ward-error' : null"
        />
      </app-form-field>
    </div>

    <app-form-field
      label="Địa chỉ cụ thể"
      controlId="addr-street"
      [required]="true"
      [error]="getError('streetAddress')"
    >
      <input
        id="addr-street"
        aria-label="Địa chỉ cụ thể"
        type="text"
        class="vic-dialog-input"
        formControlName="streetAddress"
        placeholder="Số nhà, tên tòa nhà, tên đường..."
        [attr.aria-invalid]="!!getError('streetAddress')"
        [attr.aria-describedby]="getError('streetAddress') ? 'addr-street-error' : null"
      />
    </app-form-field>

    <label class="address-dialog-form__checkbox" for="addr-is-default">
      <input
        id="addr-is-default"
        type="checkbox"
        formControlName="isDefault"
      />
      <span>Đặt làm địa chỉ mặc định</span>
    </label>

    @if (serverError()) {
      <p class="address-dialog-form__error" role="alert">
        {{ serverError() }}
      </p>
    }

    <div class="address-dialog-form__footer">
      <app-button
        variant="secondary"
        [disabled]="saving()"
        (clicked)="onClose()"
      >
        Trở lại
      </app-button>

      <app-button
        type="submit"
        variant="primary"
        [loading]="saving()"
      >
        Hoàn thành
      </app-button>
    </div>
  </form>
</app-dialog>
