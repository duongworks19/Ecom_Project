<div class="addresses-page">
  <header class="addresses-page__header">
    <div>
      <h1 class="addresses-page__title">Địa chỉ của tôi</h1>
      <p class="addresses-page__subtitle">
        Quản lý địa chỉ nhận hàng cho các đơn đặt mua
      </p>
    </div>

    <app-button variant="primary" (clicked)="openCreateDialog()">
      + Thêm địa chỉ mới
    </app-button>
  </header>

  @if (loading()) {
    <div class="addresses-page__list" aria-busy="true" aria-label="Đang tải danh sách địa chỉ">
      <app-skeleton height="128px" rounded="lg" />
      <app-skeleton height="128px" rounded="lg" />
    </div>
  } @else if (error()) {
    <app-error-state
      [message]="error()!.message"
      (retry)="loadAddresses()"
    />
  } @else if (sortedAddresses().length === 0) {
    <app-empty-state
      title="Bạn chưa lưu địa chỉ nhận hàng nào."
      description="Thêm địa chỉ nhận hàng để thanh toán nhanh chóng hơn."
      actionLabel="+ Thêm địa chỉ mới"
      (actionClicked)="openCreateDialog()"
    />
  } @else {
    <div class="addresses-page__list">
      @for (address of sortedAddresses(); track address.id) {
        <app-address-card
          [address]="address"
          [settingDefault]="settingDefaultId() === address.id"
          (editClicked)="openEditDialog($event)"
          (deleteClicked)="promptDelete($event)"
          (setDefaultClicked)="onSetDefault($event)"
        />
      }
    </div>
  }

  <app-address-dialog
    [open]="dialogOpen()"
    [initialAddress]="editingAddress()"
    [saving]="dialogSaving()"
    [serverError]="dialogError()"
    (saved)="onSaveAddress($event)"
    (cancelled)="closeDialog()"
  />

  <app-confirm-dialog
    [open]="!!deletingAddress()"
    title="Xóa địa chỉ nhận hàng"
    message="Bạn có chắc chắn muốn xóa địa chỉ này khỏi sổ địa chỉ không?"
    confirmLabel="Xóa địa chỉ"
    cancelLabel="Trở lại"
    [loading]="deletingLoading()"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
</div>
