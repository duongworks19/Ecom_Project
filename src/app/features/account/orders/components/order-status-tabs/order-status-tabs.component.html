<div class="order-tabs" role="tablist" aria-label="Lọc đơn hàng theo trạng thái">
  @for (tab of tabs; track tab.key; let i = $index) {
    <button
      #tabButton
      type="button"
      role="tab"
      class="order-tabs__tab"
      [class.order-tabs__tab--active]="activeStatus() === tab.key"
      [attr.aria-selected]="activeStatus() === tab.key"
      [attr.tabindex]="activeStatus() === tab.key ? 0 : -1"
      (click)="selectTab(tab.key)"
      (keydown)="onKeyDown($event, i)"
    >
      <span>{{ tab.label }}</span>
      @if (getCount(tab.key) !== null) {
        <span class="order-tabs__count">({{ getCount(tab.key) }})</span>
      }
    </button>
  }
</div>
