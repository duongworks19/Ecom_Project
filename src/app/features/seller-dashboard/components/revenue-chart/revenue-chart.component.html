<section class="card chart-card">
  <div class="head">
    <h2>Doanh thu</h2>
    <div class="tabs" role="tablist">
      <button
        type="button"
        [class.on]="selectedRange() === '7'"
        (click)="onTabChange('7')">
        7 ngày
      </button>
      <button
        type="button"
        [class.on]="selectedRange() === '30'"
        (click)="onTabChange('30')">
        30 ngày
      </button>
    </div>
  </div>

  <div class="chart-container" (mouseleave)="onLeaveChart()">
    <svg
      class="chart"
      [attr.viewBox]="'0 0 ' + svgWidth + ' ' + svgHeight"
      role="img"
      aria-label="Biểu đồ doanh thu">
      @for (grid of gridLines; track grid.value) {
        <line
          [attr.x1]="paddingLeft"
          [attr.x2]="svgWidth - paddingRight"
          [attr.y1]="getY(grid.value)"
          [attr.y2]="getY(grid.value)"
          stroke="var(--line)"
          stroke-width="1" />
        <text
          [attr.x]="4"
          [attr.y]="getY(grid.value) + 4"
          fill="var(--mute)">
          {{ grid.label }}
        </text>
      }

      @if (polygonAreaPoints()) {
        <polygon
          [attr.points]="polygonAreaPoints()"
          fill="var(--red)"
          opacity="0.1" />
      }

      @if (polylinePoints()) {
        <polyline
          [attr.points]="polylinePoints()"
          fill="none"
          stroke="var(--red)"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round" />
      }

      @if (lastPoint(); as last) {
        <circle
          [attr.cx]="last.x"
          [attr.cy]="last.y"
          r="5"
          fill="var(--red)" />
      }

      @for (p of chartPoints(); track p.label + p.x) {
        <circle
          [attr.cx]="p.x"
          [attr.cy]="p.y"
          r="12"
          fill="transparent"
          class="chart-hit-point"
          (mouseenter)="onHoverPoint(p)" />

        @if (activeHoverPoint()?.label === p.label) {
          <circle
            [attr.cx]="p.x"
            [attr.cy]="p.y"
            r="6"
            fill="#fff"
            stroke="var(--red)"
            stroke-width="3" />
        }

        @if (selectedRange() === '7' || $index % 5 === 0) {
          <text
            [attr.x]="p.x"
            [attr.y]="svgHeight - 6"
            text-anchor="middle"
            fill="var(--mute)">
            {{ p.label }}
          </text>
        }
      }
    </svg>

    @if (activeHoverPoint(); as tooltip) {
      <div
        class="chart-tooltip"
        [style.left.%]="(tooltip.x / svgWidth) * 100"
        [style.top.px]="tooltip.y - 12">
        <strong>{{ tooltip.exactRevenue | number:'1.0-0' }}đ</strong>
        <small>{{ tooltip.orderCount }} đơn ({{ tooltip.label }})</small>
      </div>
    }
  </div>
</section>
