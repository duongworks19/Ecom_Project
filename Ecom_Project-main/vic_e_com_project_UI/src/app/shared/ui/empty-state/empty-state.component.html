<output class="empty-state">
  <h3 class="empty-state__title">{{ title() }}</h3>
  @if (description()) {
    <p class="empty-state__desc">{{ description() }}</p>
  }
  @if (actionLabel()) {
    <div class="empty-state__action">
      <app-button variant="secondary" (clicked)="actionClicked.emit()">
        {{ actionLabel() }}
      </app-button>
    </div>
  }
</output>
