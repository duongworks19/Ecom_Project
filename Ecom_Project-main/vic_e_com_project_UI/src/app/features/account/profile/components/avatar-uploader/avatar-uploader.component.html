<div class="avatar-uploader">
  <app-avatar
    [src]="avatarUrl()"
    [name]="fullName()"
    [size]="96"
  />

  <input
    #fileInput
    type="file"
    class="avatar-uploader__file-input"
    accept=".jpg,.jpeg,.png,image/jpeg,image/png"
    aria-label="Chọn tập tin ảnh đại diện"
    (change)="onFileChange($event)"
  />

  <app-button
    variant="secondary"
    [loading]="uploading()"
    (clicked)="triggerFileDialog()"
  >
    Chọn ảnh
  </app-button>

  <p class="avatar-uploader__hint">
    Dung lượng tối đa 1 MB. Định dạng: .JPEG, .PNG
  </p>

  @if (validationError()) {
    <p class="avatar-uploader__error" role="alert">
      {{ validationError() }}
    </p>
  }
</div>
