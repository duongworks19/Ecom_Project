@if (dashboardData(); as data) {
  <div class="dashboard-page">
    <!-- Page Title & Header -->
    <section class="page-header">
      <h1 class="page-title">Tổng quan</h1>
      <p class="page-subtitle">
        Việc cần xử lý và bức tranh nhanh về đơn hàng, vendor, doanh thu của sàn.
      </p>
    </section>

    <!-- KPI Summary Cards -->
    <section class="section-kpis">
      <vic-kpi-metrics [kpis]="data.kpis"></vic-kpi-metrics>
    </section>

    <!-- Charts Row (2 Columns) -->
    <section class="section-charts">
      <div class="chart-col">
        <vic-order-status-chart
          [stats]="data.orderStatusStats.items"
          [totalOrders]="data.orderStatusStats.totalOrders"
        ></vic-order-status-chart>
      </div>
      <div class="chart-col">
        <vic-revenue-bar-chart
          [revenueData]="data.weeklyRevenue"
        ></vic-revenue-bar-chart>
      </div>
    </section>

    <!-- Recent Activities Row -->
    <section class="section-activities">
      <vic-recent-activities
        [activities]="data.recentActivities"
      ></vic-recent-activities>
    </section>
  </div>
}
