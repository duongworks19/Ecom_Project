<div class="shippers-page">
  <header class="page-header">
    <div class="header-text">
      <h1 class="page-title">Quản lý shipper</h1>
      <p class="page-subtitle">
        Tạo tài khoản, theo dõi trạng thái làm việc và lịch sử giao hàng của shipper.
      </p>
    </div>

    <a routerLink="/admin/shippers/new" class="btn-create-shipper">
      + Tạo shipper
    </a>
  </header>

  @if (toastMessage(); as toast) {
    <div class="toast-banner" role="status">{{ toast }}</div>
  }

  @if (pageError(); as error) {
    <div class="error-state" role="alert">{{ error }}</div>
  }

  <section class="section-kpis">
    <vic-shippers-kpi [summary]="summary()"></vic-shippers-kpi>
  </section>

  <section class="section-filters">
    <vic-shippers-filter-bar (filterChange)="onFilterChanged($event)"></vic-shippers-filter-bar>
  </section>

  @if (isLoading()) {
    <div class="loading-state" aria-live="polite">Đang tải danh sách shipper...</div>
  } @else {
    <section class="section-content-grid">
      <div class="col-table">
        <vic-shippers-table
          [shippers]="shippers()"
          [selectedShipperId]="selectedShipper()?.id ?? null"
          (selectShipper)="onSelectShipper($event)"
        ></vic-shippers-table>
      </div>

      <div class="col-detail">
        <vic-shipper-detail-panel
          [shipper]="selectedShipper()"
          (requestToggleLock)="onOpenLockModal($event)"
          (viewAllHistory)="onOpenHistory($event)"
        ></vic-shipper-detail-panel>
      </div>
    </section>
  }

  <vic-shipper-lock-modal
    [shipper]="lockModalShipper()"
    [errorMessage]="lockModalError()"
    [isSubmitting]="isLockSubmitting()"
    [historyShipper]="historyModalShipper()"
    [deliveries]="fullDeliveries()"
    (closeLock)="lockModalShipper.set(null)"
    (confirmLock)="onConfirmToggleLock($event)"
    (closeHistory)="historyModalShipper.set(null)"
  ></vic-shipper-lock-modal>
</div>
