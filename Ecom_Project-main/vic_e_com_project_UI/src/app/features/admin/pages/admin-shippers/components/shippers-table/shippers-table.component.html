<div class="table-card" role="region" aria-label="Danh sách shipper">
  <div class="table-header">
    <span>SHIPPER</span>
    <span>TRẠNG THÁI</span>
    <span>ĐANG GIAO</span>
    <span>KHU VỰC</span>
  </div>

  <div class="table-body">
    @for (shipper of shippers; track shipper.id) {
      <button
        type="button"
        class="table-row"
        [class.selected]="shipper.id === selectedShipperId"
        (click)="selectShipper.emit(shipper)"
      >
        <div class="shipper-cell">
          <div class="avatar-circle">{{ getInitial(shipper.fullName) }}</div>
          <div class="shipper-meta">
            <span class="shipper-name">{{ shipper.fullName }}</span>
            <span class="shipper-phone">{{ maskPhone(shipper.phone) }}</span>
          </div>
        </div>

        <div class="status-cell">
          <span class="status-badge" [ngClass]="getStatusClass(shipper)">
            <span class="dot"></span>
            {{ getStatusLabel(shipper) }}
          </span>
        </div>

        <div class="delivering-cell">{{ shipper.deliveringCount }} đơn</div>

        <div class="area-cell">{{ shipper.serviceArea }}</div>
      </button>
    } @empty {
      <div class="empty-state">Không tìm thấy shipper phù hợp với bộ lọc.</div>
    }
  </div>
</div>
