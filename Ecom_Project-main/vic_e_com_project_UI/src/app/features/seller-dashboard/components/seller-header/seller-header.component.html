<header class="top">
  <a class="brand" routerLink="/seller/dashboard">
    <span class="dot">P</span>
    <span>VIC<b>MART</b></span>
    <span class="tagk">SELLER</span>
  </a>

  <span class="sp"></span>

  <a class="pill hide-m" routerLink="/seller/shop" (click)="viewShopAsGuest.emit()">
    Xem shop như khách
  </a>

  <a class="pill hide-m" routerLink="/">
    Trang mua sắm
  </a>

  <div class="notif-wrap">
    <button
      class="pill bell"
      aria-label="Thông báo"
      type="button"
      (click)="toggleNotifications()">
      🔔
      @if (unreadCount() > 0) {
        <i>{{ unreadCount() }}</i>
      }
    </button>

    @if (isNotifOpen()) {
      <div
        class="notif-backdrop"
        tabindex="0"
        (click)="closeNotifications()"
        (keydown.escape)="closeNotifications()"></div>
      <div class="notif-dropdown" aria-label="Danh sách thông báo">
        <div class="notif-head">
          <strong>Thông báo ({{ unreadCount() }} chưa đọc)</strong>
          @if (unreadCount() > 0) {
            <button type="button" class="link-btn" (click)="onMarkAllRead($event)">
              Đọc tất cả
            </button>
          }
        </div>
        <div class="notif-list">
          @for (item of notifications(); track item.id) {
            <button
              type="button"
              class="notif-item"
              [class.unread]="!item.read"
              (click)="onNotificationClick(item)">
              <span class="notif-dot" [class.active]="!item.read"></span>
              <div class="notif-content">
                <b>{{ item.title }}</b>
                <p>{{ item.desc }}</p>
                <small>{{ item.time }}</small>
              </div>
            </button>
          } @empty {
            <div class="notif-empty">Không có thông báo mới nào</div>
          }
        </div>
      </div>
    }
  </div>

  <div class="me" (click)="openShopProfile.emit('profile')" title="Xem và sửa hồ sơ shop">
    <span class="av">{{ shopAvatarLetter() }}</span>
    <span class="t">{{ shopName() }}</span>
  </div>
</header>
